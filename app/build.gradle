plugins {
    id 'com.android.application'
}

android {
    namespace 'com.mocat.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.mocat.app'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    signingConfigs {
        mocat {
            storeFile rootProject.file('mocat.keystore')
            storePassword 'mocat2026'
            keyAlias 'mocat'
            keyPassword 'mocat2026'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.mocat
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
